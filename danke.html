<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Danke – DARMbalance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@300;400;500&family=Dancing+Script:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/phosphor-icons@1.4.2/src/css/icons.css" />
  <link rel="icon" type="image/svg+xml" href="logo-icon.svg" />
  <style>
    :root {
      --bg-main:       #f8f5ef;
      --bg-white:      #fffdf8;
      --color-primary: #516f45;
      --color-primary-dark: #354b31;
      --text-main:     #2d2d2b;
      --text-muted:    #6f706d;
      --font-heading:  'Playfair Display', Georgia, serif;
      --font-body:     'DM Sans', system-ui, sans-serif;
      --radius-md:     16px;
      --shadow-soft:   0 4px 24px rgba(67, 55, 38, 0.08);
      --transition:    0.28s cubic-bezier(0.4, 0, 0.2, 1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; }

    body {
      font-family: var(--font-body);
      background-color: var(--bg-main);
      color: var(--text-main);
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .thankyou {
      text-align: center;
      padding: 2rem;
      max-width: 520px;
    }

    .thankyou__icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: var(--color-primary);
      color: #fff;
      margin-bottom: 1.5rem;
    }

    .thankyou__icon i {
      font-size: 2.5rem;
    }

    .thankyou__script {
      font-family: 'Dancing Script', cursive;
      font-size: 1.5rem;
      color: var(--color-primary);
      margin-bottom: 0.5rem;
    }

    .thankyou__heading {
      font-family: var(--font-heading);
      font-size: clamp(1.8rem, 4vw, 2.4rem);
      font-weight: 600;
      line-height: 1.2;
      margin-bottom: 1rem;
    }

    .thankyou__text {
      color: var(--text-muted);
      font-size: 1rem;
      line-height: 1.7;
      margin-bottom: 2rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.65rem;
      border-radius: 50px;
      font-family: var(--font-body);
      font-size: 0.925rem;
      font-weight: 500;
      cursor: pointer;
      transition: background var(--transition), color var(--transition), box-shadow var(--transition), transform var(--transition);
      border: 2px solid transparent;
      text-decoration: none;
      background: var(--color-primary);
      color: #fff;
      border-color: var(--color-primary);
    }

    .btn:hover {
      background: var(--color-primary-dark);
      border-color: var(--color-primary-dark);
      box-shadow: 0 8px 36px rgba(67, 55, 38, 0.14);
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <main class="thankyou">
    <div class="thankyou__icon">
      <i class="ph ph-check"></i>
    </div>
    <p class="thankyou__script">Vielen Dank!</p>
    <h1 class="thankyou__heading">Deine Nachricht<br>ist angekommen</h1>
    <p class="thankyou__text">
      Ich melde mich in Kürze bei dir.
      Bis dahin, alles Gute für dein Bauchgefühl!
    </p>
    <a href="/" class="btn">
      <i class="ph ph-arrow-left"></i> Zurück zur Startseite
    </a>
  </main>
</body>
</html>
